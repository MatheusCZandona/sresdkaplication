events {}

http {
    upstream api {
        server api1:5000;
        server api2:5000;
    }

    server {
        listen 80;

        location /metrics {
            return 404;
        }

        location / {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}