services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: compras
      POSTGRES_PASSWORD: compras
      POSTGRES_DB: compras
    volumes:
      - dados-postgres:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compras -d compras"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine

  api1:
    build: .
    environment:
      INSTANCIA: api1
      DATABASE_URL: postgresql://compras:compras@db:5432/compras
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  api2:
    build: .
    environment:
      INSTANCIA: api2
      DATABASE_URL: postgresql://compras:compras@db:5432/compras
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-dados:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  dados-postgres:
  grafana-dados: